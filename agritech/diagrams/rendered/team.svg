<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">Паспорт сорта: участники и зона ответственности системного аналитика</title>
<desc id="desc">Агрономическая служба, производство, склад и экономисты уточняют данные и правила с системным аналитиком. Аналитик связывает их требования с работой разработки и аналитика отчётности.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<style>
text {font-family:Arial, sans-serif;fill:#182b41;}
.title {font-size:24px;font-weight:700;}
.label {font-size:17px;font-weight:700;}
.body {font-size:15px;}
.small {font-size:14px;fill:#526378;}
.edge {fill:none;stroke:#64748b;stroke-width:1.6;marker-start:url(#arrow);marker-end:url(#arrow);}
</style>
</defs>
<rect width="1000" height="630" rx="12" fill="#ffffff"/>
<text x="32" y="42" class="title">Кто участвовал в проработке «Паспорта сорта»</text>
<text x="32" y="70" class="small">Подразделения подтверждают смысл данных и правила учёта</text>
<g>
<rect x="25" y="98" width="225" height="108" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="137" y="120" text-anchor="middle" class="label">Агрономическая</text>
<text x="137" y="141" text-anchor="middle" class="label">служба</text>
<text x="137" y="168" text-anchor="middle" class="body">Сорт, участок, сезон</text>
<text x="137" y="190" text-anchor="middle" class="body">Плодоносящая площадь</text>
<rect x="267" y="98" width="225" height="108" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="379" y="128" text-anchor="middle" class="label">Производство</text>
<text x="379" y="159" text-anchor="middle" class="body">Документы сбора</text>
<text x="379" y="183" text-anchor="middle" class="body">Дата и масса</text>
<rect x="509" y="98" width="225" height="108" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="621" y="128" text-anchor="middle" class="label">Склад</text>
<text x="621" y="159" text-anchor="middle" class="body">Документы приёмки</text>
<text x="621" y="183" text-anchor="middle" class="body">Измерения и расхождения</text>
<rect x="751" y="98" width="225" height="108" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="863" y="128" text-anchor="middle" class="label">Экономисты</text>
<text x="863" y="159" text-anchor="middle" class="body">Учётные документы</text>
<text x="863" y="183" text-anchor="middle" class="body">Трактовка показателей</text>
</g>
<path class="edge" d="M137 211 C137 245 355 230 355 272"/>
<path class="edge" d="M379 211 C379 241 450 239 450 272"/>
<path class="edge" d="M621 211 C621 241 550 239 550 272"/>
<path class="edge" d="M863 211 C863 245 645 230 645 272"/>
<rect x="300" y="280" width="400" height="112" rx="9" fill="#eaf2fc" stroke="#336b9e" stroke-width="2"/>
<text x="500" y="312" text-anchor="middle" class="label">Я — системный аналитик</text>
<text x="500" y="342" text-anchor="middle" class="body">Интервью, наблюдение, разбор данных</text>
<text x="500" y="367" text-anchor="middle" class="body">Требования, сценарии и согласование</text>
<path class="edge" d="M400 398 C400 427 290 419 290 455"/>
<path class="edge" d="M600 398 C600 427 710 419 710 455"/>
<rect x="130" y="463" width="320" height="88" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="290" y="494" text-anchor="middle" class="label">Разработка</text>
<text x="290" y="525" text-anchor="middle" class="body">Обмен, проверки и обработка ошибок</text>
<rect x="550" y="463" width="320" height="88" rx="8" fill="#f4f7fa" stroke="#cbd5e1"/>
<text x="710" y="494" text-anchor="middle" class="label">Аналитик отчётности</text>
<text x="710" y="525" text-anchor="middle" class="body">Расчёты, полнота данных, сверка</text>
<line x1="32" y1="581" x2="968" y2="581" stroke="#e2e8f0"/>
<text x="32" y="610" class="small">Стрелки обозначают рабочие обсуждения и согласование требований.</text>
