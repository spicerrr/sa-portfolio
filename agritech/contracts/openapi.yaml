openapi: 3.0.3
info:
  title: Агроконтур — API справочников и учёта сбора
  version: 1.0.0
  description: Поиск единого сорта по локальному коду, регистрация сбора и просмотр партии со сведениями о складской
    приёмке.
servers:
- url: https://production.example
security:
- bearerAuth: []
paths:
  /api/v1/source-mappings/resolve:
    servers:
    - url: https://mdm.example
    get:
      operationId: resolveSourceMapping
      tags:
      - MDM
      description: Доступно читателю справочников или оператору производства. Возвращается только утверждённое соответствие.
      parameters:
      - name: sourceSystem
        in: query
        required: true
        schema: &id001
          type: string
          minLength: 1
          maxLength: 100
          description: Единый код сорта из согласованного справочника.
      - name: entityType
        in: query
        required: true
        schema:
          type: string
          enum:
          - VARIETY
      - name: sourceId
        in: query
        required: true
        schema: *id001
      responses:
        '200':
          description: Запрос выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mapping'
        '400': &id002
          description: Некорректный формат запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': &id003
          description: Пользователь не прошёл проверку подлинности.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403': &id004
          description: Нет права на выполнение операции.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': &id006
          description: Запрошенная партия или соответствие сорта не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': &id005
          description: Система временно недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Получить единый сорт по коду источника
  /api/v1/harvest-batches:
    post:
      operationId: registerHarvest
      tags:
      - Production
      description: Доступно оператору производства. Партия, результат запроса и сообщение к отправке сохраняются
        одной транзакцией.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id007
          type: string
          format: uuid
          description: Общий номер для поиска связанных действий в журнале.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HarvestCreate'
      responses:
        '201':
          description: Сбор зарегистрирован; складская приёмка подтверждается отдельно.
          headers:
            Location:
              schema:
                type: string
              description: URI партии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatch'
        '400': *id002
        '401': *id003
        '403': *id004
        '409':
          description: Конфликт повторного запроса или исходного документа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Масса, дата или связь сорта с участком не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503': *id005
      summary: Зарегистрировать сбор
  /api/v1/harvest-batches/{batchId}:
    get:
      operationId: getHarvest
      tags:
      - Production
      description: Доступно оператору производства. Возвращаются сохранённый сбор и полученное подтверждение WMS.
      parameters:
      - name: batchId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Запрос выполнен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarvestBatch'
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id006
        '503': *id005
      summary: Получить сведения о партии
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HarvestCreate:
      type: object
      additionalProperties: false
      required:
      - sourceSystem
      - sourceRecordId
      - plotId
      - varietyId
      - season
      - harvestDate
      - weightKg
      properties:
        sourceSystem: *id001
        sourceRecordId: *id001
        plotId: *id001
        varietyId: *id001
        season: &id010
          type: integer
          minimum: 2000
          maximum: 2100
          description: Календарный год сезона сбора.
        harvestDate: &id011
          type: string
          format: date
          description: Дата сбора.
        weightKg: &id012
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.001
          maximum: 999999999.999
          description: Масса сбора в килограммах.
      example:
        sourceSystem: PRODUCTION
        sourceRecordId: SRC-1284
        plotId: PLOT-044
        varietyId: VAR-017
        season: 2026
        harvestDate: '2026-08-14'
        weightKg: 8420
    Receipt:
      type: object
      required: &id008
      - lotId
      - receivedWeightKg
      - receivedAt
      properties: &id009
        lotId: *id001
        receivedWeightKg:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.001
          maximum: 999999999.999
          description: Масса приёмки, измеренная складом, в килограммах.
        receivedAt:
          type: string
          format: date-time
          description: Время складской приёмки.
    HarvestBatch:
      type: object
      required:
      - batchId
      - status
      - correlationId
      - receipt
      - sourceSystem
      - sourceRecordId
      - plotId
      - varietyId
      - season
      - harvestDate
      - weightKg
      properties:
        batchId: *id001
        status:
          type: string
          enum:
          - REGISTERED
        correlationId: *id007
        receipt:
          type: object
          required: *id008
          properties: *id009
          nullable: true
        sourceSystem: *id001
        sourceRecordId: *id001
        plotId: *id001
        varietyId: *id001
        season: *id010
        harvestDate: *id011
        weightKg: *id012
      example:
        batchId: HB-2026-001284
        status: REGISTERED
        correlationId: 93af8148-15ec-4ec7-854b-8bc887e75a90
        receipt: null
        sourceSystem: PRODUCTION
        sourceRecordId: SRC-1284
        plotId: PLOT-044
        varietyId: VAR-017
        season: 2026
        harvestDate: '2026-08-14'
        weightKg: 8420
    Mapping:
      type: object
      required:
      - varietyId
      - canonicalName
      - status
      properties:
        varietyId: *id001
        canonicalName:
          type: string
          description: Утверждённое название сорта.
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    Error:
      type: object
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
        message:
          type: string
        correlationId: *id007
